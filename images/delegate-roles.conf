# Role routing for delegate.sh. One line per role: role|cli|model|mode
#   cli    claude, codex or gemini
#   model  passed as --model; empty means that CLI's own default
#   mode   read (no file edits) or write (edits in an isolated git worktree)
# Add a role by adding a line. Edit here and rebuild. Override one run with DELEGATE_MODEL or --model.
# Model names go stale. Codex is left on its CLI default until you pick a model.
# Gemini uses gemini-3-flash-preview: the CLI default was overloaded (503), the 2.5 models returned 404,
# and the Pro models need a paid API key (free tier quota is 0).

# --- Judgment: the strongest model, advises only ---
decide|claude|claude-opus-5-5|read
design|claude|claude-opus-5-5|read
security|claude|claude-opus-5-5|read

# --- Second opinion: a different vendor from the one that wrote the work ---
review|codex||read
critique|gemini|gemini-3-flash-preview|read

# --- Building: Sonnet for work that needs thought, Haiku for work that is mechanical ---
implement|claude|claude-sonnet-5-5|write
tests|claude|claude-sonnet-5-5|write
diagnose|claude|claude-sonnet-5-5|write
mechanical|claude|claude-haiku-5-5|write

# --- Reading and summarizing: try rg, fd and git yourself first ---
search|claude|claude-haiku-5-5|read
summarize|claude|claude-haiku-5-5|read
longctx|gemini|gemini-3-flash-preview|read

# --- Writing for people ---
docs|codex||write
writeup|claude|claude-haiku-5-5|read

# --- UI design: a second vendor proposes several directions for the user to choose from ---
ui-proposals|codex||write
