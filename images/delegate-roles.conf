# Role routing for delegate.sh. One line per role: role|cli|model|mode
#   cli    claude, codex or gemini
#   model  passed as --model; empty means that CLI's own default
#   mode   read (no file edits) or write (edits in an isolated git worktree)
# The brief carries the task, so a role covers several jobs. Add a role by adding a line, and override
# the model for one run with DELEGATE_MODEL or --model. Edit here and rebuild.
# Model names go stale. Codex is left on its CLI default until you pick a model.
# Gemini uses gemini-3-flash-preview: the CLI default was overloaded (503), the 2.5 models returned 404,
# and the Pro models need a paid API key (free tier quota is 0).

# Judgment, advises only: a hard choice, a design sketch, a blast-radius or security read.
decide|claude|claude-opus-5-5|read
# Building, in a worktree: tickets, tests, a bug repro loop. For mechanical edits pass --model claude-haiku-5-5.
implement|claude|claude-sonnet-5-5|write
# Reading and summarizing many files, logs or diffs. Try rg, fd and git yourself first.
search|claude|claude-haiku-5-5|read
# Second opinions from another vendor.
review|codex||read
critique|gemini|gemini-3-flash-preview|read
# Writing for people, and UI design: a second vendor drafts docs and proposes several UI directions.
docs|codex||write
ui-proposals|codex||write
